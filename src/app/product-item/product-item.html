<mat-card>
    <mat-card-title>{{name()}}</mat-card-title>
    <mat-card-content>
        <p>Cena: {{price()}} zł</p>
    </mat-card-content>
    <mat-card-actions>
        <button matButton="filled" (click)="onAddToCart()"`>Dodaj do koszyka</button>
        <button matButton="outlined" [routerLink]="['/product', id()]">Więcej o produkcie</button>
    </mat-card-actions>
</mat-card>
