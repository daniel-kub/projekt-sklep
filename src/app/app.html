<mat-tab-group>
  <mat-tab label="Zawartość sklepu"> <app-product-list
    [products]="products"
    (addToCart)="onAddToCart($event)">
  </app-product-list>
</mat-tab>
  <mat-tab label="Koszyk">
  <ng-template matTabContent>
    <app-cart
      [cartItems]="insideCart"
      [products]="products"
      (removeItem)="onRemoveFromCart($event)">
    </app-cart>
  </ng-template>
</mat-tab>
</mat-tab-group>
