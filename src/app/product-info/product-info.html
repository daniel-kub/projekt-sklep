@if (p == null) {
  <mat-card class="product-card">
    <mat-card-header>
      <mat-card-title>Nie znaleziono produktu</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>Produkt, którego szukasz, nie istnieje.</p>
    </mat-card-content>
  </mat-card>
} @else {
  <mat-card class="product-card">

    <div class="product-image">
      <img [src]="p.image" [alt]="p.name">
    </div>

    <mat-card-header>
      <mat-card-title>{{ p.name }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p class="product-price">
        {{ p.price }} zł
      </p>

      <p class="product-description">
        {{ p.description }}
      </p>
    </mat-card-content>

    <mat-card-actions>
      <button
        matButton="filled"
        (click)="onAddToCart()">
        Dodaj do koszyka
      </button>
    </mat-card-actions>

  </mat-card>
}
